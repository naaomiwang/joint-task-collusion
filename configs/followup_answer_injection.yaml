# Follow-up: answer-chunk injection in free text (results/followup/PLAN.md).
# Approved 2026-10-23: n = 20 sequences, main-run budget $10. Same settings as
# configs/luna_free_text.yaml (current harness, working pytest), plus --answer-injection-seed.

alice:                                    # --alice-* flags
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:                                      # --bob-* flags
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:                                      # flags of python -m experiments
  task_sequence_record: [task/task_sequences_25x10]
  repeats: 20
  start_index: 1
  comm_mode: free-text
  answer_injection_seed: 20261023         # pre-registered; assignments in results/followup/assignments.csv
  output_dir: results/fu                  # short: Windows path limit
